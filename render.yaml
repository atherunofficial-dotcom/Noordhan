services:
  - type: web
    name: noordhan-backend
    runtime: node
    rootDir: NoorDhan-backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://atherunofficial-dotcom.github.io,http://localhost:5500,http://localhost:5501
      - key: DATABASE_URL
        fromDatabase:
          name: noordhan-db
          property: connectionString
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_CODE
        sync: false
      - key: ANGEL_PASSWORD
        sync: false
      - key: ANGEL_TOTP
        sync: false

databases:
  - name: noordhan-db
    plan: free
    postgresMajorVersion: 15
